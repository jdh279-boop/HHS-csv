<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HHS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Georgia,serif;cursor:pointer}
body{background:#0f2137;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{text-align:center;margin-bottom:16px}
.logo div{font-size:28px;font-weight:900;color:#0f2137}
.logo p{font-size:12px;color:#4a6275;font-weight:600}
.who{font-size:13px;font-weight:700;color:#4a6275;text-align:center;margin-bottom:12px}
.urow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:10px;background:#f4f7f9;margin-bottom:8px;user-select:none;-webkit-user-select:none}
.urow:active{background:#dde8ef}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex-shrink:0}
.uname{font-weight:700;font-size:14px;color:#0f2137}
.uspec{font-size:11px;color:#4a6275}
#pin{display:none}
.back{font-size:22px;color:#4a6275;padding:4px 8px;user-select:none}
.back:active{color:#0f2137}
.pinhead{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.who2{font-size:13px;font-weight:700;color:#4a6275;text-align:center;margin-bottom:10px}
.dots{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.dot{width:16px;height:16px;border-radius:50%;background:#e8f4f4}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.key{padding:15px;border-radius:10px;background:#f4f7f9;font-size:19px;font-weight:700;text-align:center;user-select:none;-webkit-user-select:none}
.key:active{background:#dde8ef}
.signin{width:100%;padding:13px;border-radius:10px;color:#fff;font-size:15px;font-weight:700;text-align:center;margin-top:6px;user-select:none}
.signin:active{opacity:.85}
.err{color:#d94f3d;font-size:12px;text-align:center;min-height:18px;margin-bottom:6px}
#app{display:none;position:fixed;inset:0;background:#f4f7f9;flex-direction:column}
#topbar{background:linear-gradient(135deg,#0f2137,#1e3a52);padding:12px 14px;display:flex;align-items:center;gap:10px}
#tabtitle{color:#14a8a6;font-size:10px}
#userav{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px}
#scroll{flex:1;overflow-y:auto;padding:14px 14px 72px;-webkit-overflow-scrolling:touch}
#tabs{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dde8ef;display:flex}
.tb{flex:1;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;border-top:2px solid transparent;user-select:none}
.tb.on{border-top-color:#0e7c7b}
.ti{font-size:18px}
.tl{font-size:9px;font-weight:700;color:#4a6275}
.tb.on .tl{color:#0e7c7b}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(15,33,55,.08);padding:16px;margin-bottom:12px}
.h2{font-weight:800;font-size:14px;color:#0f2137;margin-bottom:10px}
.bdg{border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap;display:inline-block}
.row{padding:8px 0;border-bottom:1px solid #e8f4f4;display:flex;justify-content:space-between;align-items:center}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sc{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(15,33,55,.08);padding:14px;text-align:center;border-top:4px solid #ccc}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(320px,100vw);background:#fff;box-shadow:-4px 0 30px rgba(0,0,0,.15);z-index:300;overflow-y:auto}
input,select,textarea{width:100%;padding:9px 10px;border-radius:8px;border:1.5px solid #c5d5df;font-size:13px;font-family:Georgia,serif;background:#fff;display:block;margin-bottom:10px}
.lbl{font-size:11px;font-weight:700;color:#4a6275;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.ab{padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;color:#fff;background:#0e7c7b;display:inline-block;user-select:none}
.ob{padding:9px 18px;border-radius:8px;border:2px solid #4a6275;font-size:13px;font-weight:700;color:#4a6275;background:transparent;display:inline-block;user-select:none}
.rb{padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;color:#fff;background:#d94f3d;display:inline-block;user-select:none}
.sb2{padding:5px 12px;border-radius:7px;font-size:12px;font-weight:700;color:#fff;background:#0e7c7b;display:inline-block;user-select:none}
</style>
</head>
<body>

<div class="box" id="loginbox">
  <div class="logo">
    <div>HHS</div>
    <p>Holiday Home Solutions</p>
  </div>
  <div id="ulist">
    <div class="who">Who are you?</div>
    <div class="urow" id="u0"><div class="av" style="background:#0f2137">J</div><div><div class="uname">Jamie Hancock</div><div class="uspec">Owner / Admin</div></div></div>
    <div class="urow" id="u1"><div class="av" style="background:#0e7c7b">J</div><div><div class="uname">James Thomas</div><div class="uspec">Multi-Skilled</div></div></div>
    <div class="urow" id="u2"><div class="av" style="background:#2e9e6b">I</div><div><div class="uname">Ian Breaker</div><div class="uspec">Multi-Skilled</div></div></div>
    <div class="urow" id="u3"><div class="av" style="background:#6b4fa0">A</div><div><div class="uname">Alice-May Hancock</div><div class="uspec">Hot Tubs</div></div></div>
    <div class="urow" id="u4"><div class="av" style="background:#f0a500">J</div><div><div class="uname">Jodi Smith</div><div class="uspec">Admin & Social</div></div></div>
  </div>
  <div id="pin">
    <div class="pinhead">
      <div class="back" id="backbtn">←</div>
      <div class="av" id="pav"></div>
      <div id="pname" style="font-weight:700;color:#0f2137;font-size:14px"></div>
    </div>
    <div class="who2">Enter your PIN</div>
    <div class="dots"><div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div>
    <div class="keys">
      <div class="key" id="k1">1</div><div class="key" id="k2">2</div><div class="key" id="k3">3</div>
      <div class="key" id="k4">4</div><div class="key" id="k5">5</div><div class="key" id="k6">6</div>
      <div class="key" id="k7">7</div><div class="key" id="k8">8</div><div class="key" id="k9">9</div>
      <div class="key" id="kback">←</div><div class="key" id="k0">0</div><div class="key" id="kdel">⌫</div>
    </div>
    <div class="err" id="perr"></div>
    <div class="signin" id="sinbtn">Sign In</div>
  </div>
</div>

<div id="app">
  <div id="topbar">
    <div style="width:32px;height:32px;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;color:#0f2137;font-size:11px">HHS</div>
    <div style="flex:1"><div style="color:#fff;font-weight:900;font-size:14px">Holiday Home Solutions</div><div id="tabtitle">Dashboard</div></div>
    <div id="userav" class="av"></div>
  </div>
  <div id="scroll"></div>
  <div id="tabs"></div>
</div>

<script>
var USERS=[
  {id:'admin',name:'Jamie Hancock',role:'admin',color:'#0f2137',pin:'1234'},
  {id:'james',name:'James Thomas',role:'engineer',color:'#0e7c7b',pin:'2001'},
  {id:'ian',name:'Ian Breaker',role:'engineer',color:'#2e9e6b',pin:'2002'},
  {id:'alice',name:'Alice-May Hancock',role:'engineer',color:'#6b4fa0',pin:'2003'},
  {id:'jodi',name:'Jodi Smith',role:'admin',color:'#f0a500',pin:'2004'}
];
var EN=['James Thomas','Ian Breaker','Alice-May Hancock','Jodi Smith'];
var JT=['Caravan Siting','Caravan Relocation','Winter Drain Down','Spring Reconnection','Caravan Wash','Caravan Wash + Decking','Hot Tub Changeover Clean','Hot Tub Maintenance','Hot Tub Repair','Hot Tub Winterisation','Key Holder Call-Out','Emergency Call-Out','Bathroom Refurbishment','Kitchen/Appliance Fit','Cladding/Re-clad','Skylight Repair','Carpet/Flooring Fit','Plumbing (Non-Gas)','Electrical (Sub-contract)','Gas (Sub-contract)','General Repairs','Photo/Video Report','Winter Ready Package'];
var ST=['Scheduled','In Progress','Completed','On Hold','Cancelled'];
var SC={Scheduled:'#0e7c7b','In Progress':'#f0a500',Completed:'#2e9e6b','On Hold':'#6b4fa0',Cancelled:'#d94f3d'};
var DC=[
  {id:1,name:'Alan & Pat Briggs',phone:'07712 334455',email:'alanpat@email.co.uk',site:'Lakeside Park',pitch:'14B',caravan:'Willerby Avonmore 2019',notes:'Key holder - Basic package.',pkg:'Basic'},
  {id:2,name:'Sandra Hollis',phone:'07823 991122',email:'sandrah@webmail.com',site:'Meadow View',pitch:'7',caravan:'ABI Windermere 2021',notes:'Hot tub owner. Prefers mornings.',pkg:'Standard'},
  {id:3,name:'Raj Patel',phone:'07934 556677',email:'raj.patel@gmail.com',site:'Lakeside Park',pitch:'22A',caravan:'Swift Challenger 2020',notes:'Key holder active.',pkg:'Premium'},
  {id:4,name:'Gower Villa Caravan Park',phone:'01792 000000',email:'info@gowervilla.co.uk',site:'Gower Villa',pitch:'Trade',caravan:'Multiple units',notes:'Trade client. Glamping pods + static caravans.',pkg:'Trade'},
  {id:5,name:'Graham Whittle',phone:'07765 998877',email:'gwhittle@live.co.uk',site:'Meadow View',pitch:'11',caravan:'Willerby Sheraton 2022',notes:'Hot tub + key holder.',pkg:'Standard'}
];
var DJ=[
  {id:101,cid:1,type:'Winter Drain Down',status:'Completed',date:'2026-01-15',eng:'James Thomas',quote:60,invoiced:true,notes:'Annual drain down.',hours:'2'},
  {id:102,cid:2,type:'Hot Tub Changeover Clean',status:'Scheduled',date:'2026-06-03',eng:'Alice-May Hancock',quote:150,invoiced:false,notes:'Monthly clean.',hours:''},
  {id:103,cid:3,type:'Key Holder Call-Out',status:'In Progress',date:'2026-05-29',eng:'James Thomas',quote:70,invoiced:false,notes:'Water leak under van.',hours:'2'},
  {id:104,cid:4,type:'Caravan Siting',status:'Scheduled',date:'2026-06-10',eng:'James Thomas',quote:1200,invoiced:false,notes:'2 units. Park supplies blocks.',hours:''},
  {id:105,cid:2,type:'Hot Tub Maintenance',status:'Completed',date:'2026-03-10',eng:'Alice-May Hancock',quote:150,invoiced:true,notes:'Filter replacement.',hours:'2'},
  {id:106,cid:1,type:'Spring Reconnection',status:'Completed',date:'2026-03-20',eng:'Ian Breaker',quote:60,invoiced:true,notes:'Spring reconnection.',hours:'2'},
  {id:107,cid:3,type:'Skylight Repair',status:'Completed',date:'2026-04-05',eng:'James Thomas',quote:75,invoiced:true,notes:'Leak fixed.',hours:'3'},
  {id:108,cid:4,type:'Caravan Wash',status:'Completed',date:'2026-04-18',eng:'Ian Breaker',quote:100,invoiced:true,notes:'Full exterior wash.',hours:'3'}
];

function lsG(k,d){try{var v=localStorage.getItem('hhs_'+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsS(k,v){try{localStorage.setItem('hhs_'+k,JSON.stringify(v));}catch(e){}}
function uid(){return Math.floor(Math.random()*90000)+10000;}
function fmt(d){return d?new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';}
function cur(n){return '£'+Number(n||0).toFixed(2);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function bdg(l,c){return '<span class="bdg" style="background:'+c+'22;color:'+c+';border:1px solid '+c+'55">'+esc(l)+'</span>';}
function save(){lsS('c',cs);lsS('j',js);lsS('co',cos);}

var cs,js,cos,cu,ctab='dashboard';
var _pin='',_correct='',_col='',_cuid='';

// Use touchstart for iOS - most reliable
function tap(el, fn) {
  var moved = false;
  el.addEventListener('touchstart', function(e){ moved=false; }, {passive:true});
  el.addEventListener('touchmove', function(e){ moved=true; }, {passive:true});
  el.addEventListener('touchend', function(e){
    if(!moved){ e.preventDefault(); fn(); }
  });
  el.addEventListener('click', function(e){ fn(); });
}

// Wire up user buttons
var userData = [
  ['admin','Jamie Hancock','#0f2137','1234'],
  ['james','James Thomas','#0e7c7b','2001'],
  ['ian','Ian Breaker','#2e9e6b','2002'],
  ['alice','Alice-May Hancock','#6b4fa0','2003'],
  ['jodi','Jodi Smith','#f0a500','2004']
];
for(var i=0;i<5;i++){
  (function(d){
    tap(document.getElementById('u'+d[0]), function(){
      pick(d[1],d[2],d[3],d[4]);
    });
  })([i].concat(userData[i]));
}

// PIN keys
for(var n=0;n<=9;n++){
  (function(num){
    tap(document.getElementById('k'+num), function(){ kp(num); });
  })(n);
}
tap(document.getElementById('kdel'), function(){ _pin=_pin.slice(0,-1); dots(); });
tap(document.getElementById('kback'), function(){ _pin=_pin.slice(0,-1); dots(); });
tap(document.getElementById('backbtn'), function(){ goBack(); });
tap(document.getElementById('sinbtn'), function(){ tryLogin(); });
tap(document.getElementById('userav'), function(){ signOut(); });

function pick(uid,name,col,pin){
  _pin=''; _correct=pin; _col=col; _cuid=uid;
  document.getElementById('ulist').style.display='none';
  document.getElementById('pin').style.display='block';
  var av=document.getElementById('pav');
  av.textContent=name[0]; av.style.background=col;
  document.getElementById('pname').textContent=name;
  document.getElementById('sinbtn').style.background=col;
  document.getElementById('perr').textContent='';
  dots();
}

function goBack(){
  document.getElementById('ulist').style.display='block';
  document.getElementById('pin').style.display='none';
  _pin='';
}

function dots(){
  for(var i=0;i<4;i++){
    document.getElementById('d'+i).style.background=_pin.length>i?_col:'#e8f4f4';
  }
}

function kp(n){ if(_pin.length<4){ _pin+=String(n); dots(); if(_pin.length===4) setTimeout(tryLogin,200); } }

function tryLogin(){
  if(_pin===_correct){
    cu=USERS.find(function(u){return u.id===_cuid;});
    cs=lsG('c',DC); js=lsG('j',DJ); cos=lsG('co',[]);
    document.getElementById('loginbox').style.display='none';
    document.body.style.background='#f4f7f9';
    document.body.style.display='block';
    var app=document.getElementById('app');
    app.style.display='flex';
    var av=document.getElementById('userav');
    av.textContent=cu.name[0]; av.style.background=cu.color;
    buildTabs(); go('dashboard');
  } else {
    document.getElementById('perr').textContent='Wrong PIN — try again';
    _pin=''; dots();
  }
}

function signOut(){
  document.getElementById('app').style.display='none';
  document.getElementById('loginbox').style.display='block';
  document.body.style.background='linear-gradient(135deg,#0f2137,#1e3a52)';
  document.body.style.display='flex';
  document.getElementById('ulist').style.display='block';
  document.getElementById('pin').style.display='none';
  _pin='';
}

function buildTabs(){
  var isA=(cu.role==='admin');
  var tabs=isA
    ?[['dashboard','🏠','Board'],['jobs','📋','Jobs'],['customers','👥','Customers'],['callouts','🚨','Callouts'],['quotes','💷','Quotes'],['timesheets','⏱️','Hours']]
    :[['dashboard','🏠','Board'],['jobs','📋','My Jobs'],['customers','👥','Customers'],['callouts','🚨','Callouts'],['timesheets','⏱️','Hours']];
  var h='';
  tabs.forEach(function(t){
    h+='<div class="tb" id="t-'+t[0]+'"><div class="ti">'+t[1]+'</div><div class="tl">'+t[2]+'</div></div>';
  });
  document.getElementById('tabs').innerHTML=h;
  tabs.forEach(function(t){
    tap(document.getElementById('t-'+t[0]), function(){ go(t[0]); });
  });
}

function go(tab){
  ctab=tab;
  document.querySelectorAll('.tb').forEach(function(b){b.classList.remove('on');});
  var tb=document.getElementById('t-'+tab); if(tb) tb.classList.add('on');
  var T={dashboard:'Dashboard',jobs:'Jobs',customers:'Customers',callouts:'Call-Outs',quotes:'Quotes & Invoices',timesheets:'Timesheets'};
  document.getElementById('tabtitle').textContent=T[tab]||tab;
  var el=document.getElementById('scroll');
  if(tab==='dashboard') el.innerHTML=dash();
  else if(tab==='jobs') el.innerHTML=jobsList();
  else if(tab==='customers') el.innerHTML=custList();
  else if(tab==='callouts') el.innerHTML=coList();
  else if(tab==='quotes') el.innerHTML=qList();
  else if(tab==='timesheets') el.innerHTML=tList();
  el.scrollTop=0;
  wireButtons();
}

function wireButtons(){
  document.querySelectorAll('[data-tap]').forEach(function(el){
    var fn=el.getAttribute('data-tap');
    var arg=el.getAttribute('data-arg')||'';
    tap(el, function(){ window[fn] && window[fn](arg); });
  });
}

function dash(){
  var isA=(cu.role==='admin');
  var my=isA?js:js.filter(function(j){return j.eng===cu.name;});
  var today=new Date().toISOString().slice(0,10);
  var tj=my.filter(function(j){return j.date===today;});
  var uninv=js.filter(function(j){return !j.invoiced&&j.status==='Completed';});
  var pipe=js.filter(function(j){return j.status==='Scheduled';}).reduce(function(a,j){return a+Number(j.quote||0);},0);
  var h='';
  if(!isA){h+='<div style="background:linear-gradient(135deg,'+cu.color+','+cu.color+'bb);border-radius:12px;padding:14px;margin-bottom:14px;color:#fff;display:flex;align-items:center;gap:12px"><div style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900">'+cu.name[0]+'</div><div><div style="font-weight:800;font-size:15px">Welcome, '+esc(cu.name.split(' ')[0])+'!</div><div style="font-size:12px;opacity:.85">Your workload today</div></div></div>';}
  var stats=isA?[['👥',cs.length,'Customers','#0f2137'],['📅',js.filter(function(j){return j.status==='Scheduled';}).length,'Scheduled','#0e7c7b'],['💷',uninv.length,'Uninvoiced','#f0a500'],['📈',cur(pipe),'Pipeline','#2e9e6b']]:[['📅',my.filter(function(j){return j.status==='Scheduled';}).length,'Scheduled','#0e7c7b'],['🔧',my.filter(function(j){return j.status==='In Progress';}).length,'In Progress','#f0a500'],['✅',my.filter(function(j){return j.status==='Completed';}).length,'Done','#2e9e6b'],['⏱️',my.reduce(function(a,j){return a+(parseFloat(j.hours)||0);},0)+'h','Hours','#6b4fa0']];
  h+='<div class="sg">';
  stats.forEach(function(s){h+='<div class="sc" style="border-top-color:'+s[3]+'"><div style="font-size:20px;margin-bottom:4px">'+s[0]+'</div><div style="font-size:22px;font-weight:900;color:'+s[3]+'">'+s[1]+'</div><div style="font-size:11px;color:#4a6275;font-weight:600">'+esc(s[2])+'</div></div>';});
  h+='</div><div class="card"><div class="h2">📋 Today\'s Jobs</div>';
  if(!tj.length) h+='<div style="color:#4a6275;font-size:13px">No jobs today.</div>';
  tj.forEach(function(j){var c=cs.find(function(x){return x.id===j.cid;});h+='<div class="row"><div><div style="font-weight:700;font-size:13px">'+esc(j.type)+'</div><div style="font-size:12px;color:#4a6275">'+(c?esc(c.name):'')+'</div></div>'+bdg(j.status,SC[j.status])+'</div>';});
  h+='</div>';
  if(isA&&uninv.length){h+='<div class="card"><div class="h2">💷 Outstanding</div>';uninv.slice(0,5).forEach(function(j){var c=cs.find(function(x){return x.id===j.cid;});h+='<div class="row"><div><div style="font-weight:700;font-size:13px">'+(c?esc(c.name):'')+'</div><div style="font-size:12px;color:#4a6275">'+esc(j.type)+'</div></div><span style="font-weight:800;color:#f0a500">'+cur(j.quote)+'</span></div>';});h+='</div>';}
  return h;
}

var _sf='',_ef='';
function jobsList(){
  var isA=(cu.role==='admin');
  var vis=isA?js:js.filter(function(j){return j.eng===cu.name;});
  var fil=vis.filter(function(j){return(!_sf||j.status===_sf)&&(!_ef||j.eng===_ef);});
  var h='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center">';
  h+='<select onchange="_sf=this.value;go(\'jobs\')" style="flex:1;padding:7px;border-radius:7px;border:1.5px solid #c5d5df;font-size:12px;margin:0"><option value="">All Statuses</option>';
  ST.forEach(function(s){h+='<option'+(s===_sf?' selected':'')+' value="'+esc(s)+'">'+esc(s)+'</option>';});
  h+='</select>';
  if(isA){h+='<select onchange="_ef=this.value;go(\'jobs\')" style="flex:1;padding:7px;border-radius:7px;border:1.5px solid #c5d5df;font-size:12px;margin:0"><option value="">All Engineers</option>';EN.forEach(function(e){h+='<option'+(e===_ef?' selected':'')+'>'+esc(e.split(' ')[0])+'</option>';});h+='</select>';}
  h+='<div class="ab" data-tap="jModal" data-arg="0" style="white-space:nowrap">+ New</div></div>';
  if(!fil.length) return h+'<div style="text-align:center;padding:32px;color:#4a6275">No jobs.</div>';
  fil.forEach(function(j){
    var c=cs.find(function(x){return x.id===j.cid;});
    h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px"><div style="flex:1;padding-right:8px"><div style="font-weight:800;font-size:14px;color:#0f2137">'+esc(j.type)+'</div><div style="font-size:12px;color:#4a6275">'+(c?esc(c.name)+' · '+esc(c.site):'')+'</div><div style="font-size:12px;color:#4a6275">'+fmt(j.date)+' · '+esc((j.eng||'').split(' ')[0])+'</div></div>'+bdg(j.status,SC[j.status])+'</div>';
    if(isA) h+='<div style="font-size:13px;font-weight:700;margin-bottom:8px">'+cur(j.quote)+(j.invoiced?' ✅':' ⏳')+'</div>';
    if(j.notes) h+='<div style="font-size:12px;color:#4a6275;font-style:italic;margin-bottom:8px">'+esc(j.notes)+'</div>';
    h+='<div style="display:flex;gap:6px"><div class="sb2" data-tap="jModal" data-arg="'+j.id+'">Edit</div>';
    if(isA) h+='<div class="sb2" style="background:#d94f3d" data-tap="delJ" data-arg="'+j.id+'">Del</div>';
    h+='</div></div>';
  });
  return h;
}

function delJ(id){if(confirm('Delete?')){js=js.filter(function(j){return j.id!==Number(id);});save();go('jobs');}}

function jModal(jid){

  var tO='<option value="">— select —</option>';JT.forEach(function(t){tO+='<option'+(j&&j.type===t?' selected':'')+' value="'+esc(t)+'">'+esc(t)+'</option>';});

    +(isA?'<div class="lbl">Engineer</div><select id="je" style="margin-bottom:10px">'+eO+'</select>':'<div style="font-size:13px;color:#4a6275;margin-bottom:10px">Engineer: <b>'+esc(cu.name)+'</b></div>')
    +(isA?'<div class="lbl">Quote (£)</div><input type="number" id="jq" value="'+(j?j.quote:'')+'" style="margin-bottom:10px"/>':'')
    +'<div class="lbl">Hours</div><input id="jh" value="'+(j?esc(j.hours||''):'')+'" style="margin-bottom:10px"/>'
    +'<div class="lbl">Notes</div><textarea id="jn" rows="3" style="margin-bottom:10px">'+(j?esc(j.notes):'')+'</textarea>'
    +(isA?'<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><input type="checkbox" id="jinv"'+(j&&j.invoiced?' checked':'')+'/><label style="font-size:13px">Mark as Invoiced</label></div>':'')
    +'<div style="display:flex;gap:10px;justify-content:flex-end"><div class="ob" id="jmcancel">Cancel</div><div class="ab" id="jmsave">Save</div></div></div>';

function saveJ(jid){
  var isA=(cu.role==='admin');
  var cid=parseInt(document.getElementById('jc').value);
  var type=document.getElementById('jt').value;
  var status=document.getElementById('js2').value;
  var date=document.getElementById('jd').value;
  var eng=isA&&document.getElementById('je')?document.getElementById('je').value:cu.name;
  var quote=isA?(parseFloat(document.getElementById('jq').value)||0):0;
  var hours=document.getElementById('jh').value;
  var notes=document.getElementById('jn').value;
  var inv=isA&&document.getElementById('jinv')&&document.getElementById('jinv').checked;
  if(!cid||!type||!date){alert('Fill in customer, type and date.');return;}
  var obj={id:jid||uid(),cid:cid,type:type,status:status,date:date,eng:eng,quote:quote,invoiced:inv,notes:notes,hours:hours};
  if(jid){js=js.map(function(x){return x.id===jid?obj:x;});}else{js.push(obj);}
  save();document.getElementById('jm').remove();go('jobs');
}

var _cs='';
function custList(){
  var isA=(cu.role==='admin');
  var s=_cs.toLowerCase();

    h+='<span style="font-size:12px;background:#0e7c7b22;color:#0e7c7b;border:1px solid #0e7c7b55;border-radius:12px;padding:1px 8px">'+esc(c.pkg||'')+'</span></div>';
    h+='<div style="font-size:12px;color:#4a6275;margin-bottom:1px">📍 '+esc(c.site)+' · Pitch '+esc(c.pitch)+'</div>';
    h+='<div style="font-size:12px;color:#4a6275;margin-bottom:1px">🚐 '+esc(c.caravan)+'</div>';
    h+='<div style="font-size:12px;color:#4a6275">📞 '+esc(c.phone)+'</div>';
    if(last) h+='<div style="font-size:11px;color:#4a6275;margin-top:6px;border-top:1px solid #e8f4f4;padding-top:5px">'+cj.length+' jobs · Last: '+fmt(last.date)+'</div>';
    h+='</div>';
  });

}

function cDetail(cid){

  var isA=(cu.role==='admin');
  var cj=js.filter(function(j){return j.cid===c.id;}).slice().sort(function(a,b){return b.date.localeCompare(a.date);});
  var ex=document.getElementById('cdr');if(ex)ex.remove();
  var d=document.createElement('div');d.className='drawer';d.id='cdr';

  h+='<div><div style="color:#fff;font-weight:900;font-size:15px">'+esc(c.name)+'</div><div style="color:#14a8a6;font-size:12px">'+esc(c.site)+' · P'+esc(c.pitch)+'</div></div>';
  h+='<div class="av" id="cdrx" style="background:rgba(255,255,255,.2);color:#fff;font-size:16px;width:30px;height:30px">✕</div></div>';
  h+='<div style="padding:14px">';
  h+='<div class="card"><div class="lbl" style="margin-bottom:4px">Package</div><b style="color:#0e7c7b">'+esc(c.pkg||'None')+'</b></div>';
  h+='<div class="card"><div class="lbl" style="margin-bottom:4px">Caravan</div><b>'+esc(c.caravan)+'</b></div>';
  h+='<div class="card"><div class="lbl" style="margin-bottom:4px">Contact</div><div style="font-size:13px">📞 '+esc(c.phone)+'</div><div style="font-size:13px">✉️ '+esc(c.email)+'</div>'+(c.notes?'<div style="font-size:12px;color:#4a6275;margin-top:6px;background:#f4f7f9;padding:6px 8px;border-radius:6px">💬 '+esc(c.notes)+'</div>':'')+'</div>';
  h+='<div class="card"><div class="lbl" style="margin-bottom:6px">Job History</div>';
  cj.slice(0,6).forEach(function(j){h+='<div class="row"><span style="font-size:12px">'+esc(j.type.split(' ').slice(0,3).join(' '))+'</span>'+bdg(j.status,SC[j.status])+'</div>';});
  h+='</div>';
  if(isA) h+='<div class="ab" id="cdredit" style="width:100%;text-align:center;padding:10px;display:block;margin-top:4px">Edit Customer</div>';
  h+='</div>';
  d.innerHTML=h;document.body.appendChild(d);
  tap(document.getElementById('cdrx'), function(){d.remove();});
  if(isA) tap(document.getElementById('cdredit'), function(){d.remove();cModal(cid);});
}

function cModal(cid){
  cid=Number(cid)||0;
  var c=cid?cs.find(function(x){return x.id===cid;}):null;
  var pkgOpts=['None','Basic','Standard','Premium','Trade'].map(function(p){return '<option'+(p===(c?c.pkg:'None')?' selected':'')+'>'+p+'</option>';}).join('');

function saveC(cid){
  var c={id:cid||uid(),name:document.getElementById('cn').value,phone:document.getElementById('cph').value,email:document.getElementById('cem').value,site:document.getElementById('csi').value,pitch:document.getElementById('cpi').value,caravan:document.getElementById('cca').value,notes:document.getElementById('cno').value,pkg:document.getElementById('cpkg').value};
  if(!c.name){alert('Name required.');return;}
  if(cid){cs=cs.map(function(x){return x.id===cid?c:x;});}else{cs.push(c);}
  save();document.getElementById('cm').remove();var dr=document.getElementById('cdr');if(dr)dr.remove();go('customers');
}

function coList(){
  var isA=(cu.role==='admin');
  var act=cos.filter(function(c){return c.status!=='Resolved';});
  var h='<div style="display:flex;justify-content:space-between;margin-bottom:14px;align-items:center"><div style="font-size:13px;color:#4a6275">'+act.length+' active</div><div class="rb" data-tap="coModal" data-arg="0">🚨 Log Call-Out</div></div>';
  if(act.length){
    h+='<div style="background:#fff5f5;border:1.5px solid #d94f3d;border-radius:10px;padding:14px;margin-bottom:14px"><div style="font-weight:800;font-size:13px;color:#d94f3d;margin-bottom:10px">🚨 Active</div>';
    act.forEach(function(co){var cu2=cs.find(function(x){return x.id===co.cid;});h+='<div style="background:#fff;border-radius:8px;padding:12px;margin-bottom:8px;border:1px solid #fcc"><b style="font-size:14px">'+esc(co.type)+'</b><div style="font-size:12px;color:#4a6275;margin:3px 0">'+(cu2?esc(cu2.name)+' · '+esc(cu2.site):'')+'</div><div style="font-size:12px;color:#4a6275;margin-bottom:6px">'+new Date(co.ts).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})+' · '+esc(co.eng)+'</div>'+(co.notes?'<div style="font-size:12px;margin-bottom:8px">'+esc(co.notes)+'</div>':'')+'<div class="sb2" style="background:#2e9e6b" data-tap="resCo" data-arg="'+co.id+'">✓ Resolved</div></div>';});
    h+='</div>';
  }
  h+='<div class="card"><div class="h2">📋 History</div>';
  if(!cos.length) h+='<div style="color:#4a6275;font-size:13px">No call-outs logged.</div>';
  cos.forEach(function(co){var cu2=cs.find(function(x){return x.id===co.cid;});h+='<div class="row"><div><div style="font-weight:700;font-size:13px">'+esc(co.type)+' — '+(cu2?esc(cu2.name):'')+'</div><div style="font-size:11px;color:#4a6275">'+new Date(co.ts).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})+' · '+esc(co.eng)+'</div></div>'+bdg(co.status,co.status==='Resolved'?'#2e9e6b':'#d94f3d')+'</div>';});
  h+='</div>';return h;
}

function resCo(id){cos=cos.map(function(c){return c.id===Number(id)?Object.assign({},c,{status:'Resolved'}):c;});save();go('callouts');}

function coModal(){
  var isA=(cu.role==='admin');
  var now=new Date().toISOString().slice(0,16);
  var cO='<option value="">— select —</option>';cs.forEach(function(c){cO+='<option value="'+c.id+'">'+esc(c.name)+'</option>';});
  var typs=['Water Leak','Gas Smell','Alarm Triggered','Access Required','Plumbing Issue','Hot Tub Issue','Storm Damage','Vandalism','Other'];

  var eO='';EN.forEach(function(e){eO+='<option'+(e===cu.name?' selected':'')+'>'+esc(e)+'</option>';});
  var rates='<div style="background:#f4f7f9;border-radius:8px;padding:10px;margin-bottom:12px;font-size:12px;color:#4a6275"><b style="color:#0f2137">Call-Out Rates:</b><br>Daytime (8am-6pm): £70/hr<br>Evening/Weekend: £95/hr<br>Night (10pm-8am): £130 flat</div>';
  var m=document.createElement('div');m.className='modal-bg';m.id='com';
  m.innerHTML='<div class="modal"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><b style="font-size:16px;color:#d94f3d">🚨 Log Call-Out</b><div class="ob" id="comx" style="padding:6px 12px">✕</div></div>'
    +rates
    +'<div class="lbl">Customer</div><select id="coc" style="margin-bottom:10px">'+cO+'</select>'
    +'<div class="lbl">Type</div><select id="cot" style="margin-bottom:10px">'+tO+'</select>'
    +(isA?'<div class="lbl">Engineer</div><select id="coe" style="margin-bottom:10px">'+eO+'</select>':'')
    +'<div class="lbl">Status</div><select id="cos2" style="margin-bottom:10px">'+stO+'</select>'

    +'<div class="lbl">Notes</div><textarea id="con" rows="3" style="margin-bottom:14px"></textarea>'
    +'<div style="display:flex;gap:10px;justify-content:flex-end"><div class="ob" id="comcancel">Cancel</div><div class="rb" id="comsave">Log</div></div></div>';
  document.body.appendChild(m);
  tap(document.getElementById('comx'), function(){m.remove();});
  tap(document.getElementById('comcancel'), function(){m.remove();});
  tap(document.getElementById('comsave'), function(){saveCo();});
}

function saveCo(){
  var isA=(cu.role==='admin');
  var cid=parseInt(document.getElementById('coc').value);
  var type=document.getElementById('cot').value;
  var eng=isA&&document.getElementById('coe')?document.getElementById('coe').value:cu.name;
  var status=document.getElementById('cos2').value;
  var ts=new Date(document.getElementById('codt').value).toISOString();
  var notes=document.getElementById('con').value;
  if(!cid||!type){alert('Select customer and type.');return;}
  cos.unshift({id:uid(),cid:cid,type:type,eng:eng,status:status,ts:ts,notes:notes});
  save();document.getElementById('com').remove();go('callouts');
}

var _qt='uninv';
function qList(){
  var uninv=js.filter(function(j){return !j.invoiced&&j.status==='Completed';});
  var inv=js.filter(function(j){return j.invoiced;});
  var list=_qt==='uninv'?uninv:_qt==='inv'?inv:js.filter(function(j){return j.quote>0;});
  var uV=uninv.reduce(function(a,j){return a+Number(j.quote||0);},0);
  var iV=inv.reduce(function(a,j){return a+Number(j.quote||0);},0);
  var tV=js.reduce(function(a,j){return a+Number(j.quote||0);},0);
  var h='<div class="sg" style="grid-template-columns:repeat(3,1fr)">';
  [['#f0a500',cur(uV),'Outstanding'],['#2e9e6b',cur(iV),'Invoiced'],['#0e7c7b',cur(tV),'Total']].forEach(function(s){h+='<div class="sc" style="border-top-color:'+s[0]+';padding:10px"><div style="font-size:15px;font-weight:900;color:'+s[0]+'">'+s[1]+'</div><div style="font-size:10px;color:#4a6275;font-weight:600">'+s[2]+'</div></div>';});
  h+='</div><div style="display:flex;gap:4px;margin-bottom:12px">';
  [['uninv','⏳ Awaiting'],['inv','✅ Invoiced'],['all','📋 All']].forEach(function(t){h+='<div data-tap="setQt" data-arg="'+t[0]+'" style="padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;background:'+(_qt===t[0]?'#0f2137':'#f0f0f0')+';color:'+(_qt===t[0]?'#fff':'#4a6275')+'">'+t[1]+'</div>';});
  h+='</div>';
  if(!list.length) return h+'<div style="text-align:center;padding:32px;color:#4a6275">Nothing here.</div>';
  list.forEach(function(j){var c=cs.find(function(x){return x.id===j.cid;});h+='<div class="card" style="margin-bottom:8px"><div class="row" style="border:none;padding-bottom:4px"><b style="font-size:13px;color:#0f2137">'+(c?esc(c.name):'')+'</b>'+bdg(j.status,SC[j.status])+'</div><div style="font-size:12px;color:#4a6275;margin-bottom:6px">'+esc(j.type)+' · '+fmt(j.date)+'</div><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:14px">'+cur(j.quote)+'</b>'+(!j.invoiced&&j.status==='Completed'?'<div class="sb2" style="background:#2e9e6b" data-tap="markInv" data-arg="'+j.id+'">Mark Invoiced</div>':'')+'</div></div>';});
  return h;
}
function setQt(q){_qt=q;go('quotes');}
function markInv(id){js=js.map(function(j){return j.id===Number(id)?Object.assign({},j,{invoiced:true}):j;});save();go('quotes');}

var _te='';
function tList(){
  var isA=(cu.role==='admin');
  var ef=_te||(isA?'':cu.name);
  var h='';
  if(isA){h='<div style="margin-bottom:14px"><select onchange="_te=this.value;go(\'timesheets\')" style="padding:8px 12px;border-radius:8px;border:1.5px solid #c5d5df;font-size:13px;margin:0"><option value="">All Engineers</option>';EN.forEach(function(e){h+='<option'+(e===ef?' selected':'')+'>'+esc(e)+'</option>';});h+='</select></div>';}
  var cols={'James Thomas':'#0e7c7b','Ian Breaker':'#2e9e6b','Alice-May Hancock':'#6b4fa0','Jodi Smith':'#f0a500'};
  EN.filter(function(e){return !ef||e===ef;}).forEach(function(e){
    var col=cols[e]||'#0e7c7b';
    var ej=js.filter(function(j){return j.hours&&j.eng===e;});
    var tot=ej.reduce(function(a,j){return a+(parseFloat(j.hours)||0);},0);
    h+='<div class="card" style="margin-bottom:12px;border-top:4px solid '+col+'"><b style="font-size:14px;color:#0f2137">'+esc(e)+'</b><div style="font-size:12px;color:#4a6275;margin-bottom:10px">Total: <b style="color:'+col+'">'+tot+'h</b> · '+ej.length+' jobs</div>';
    if(!ej.length) h+='<div style="font-size:12px;color:#4a6275">No entries.</div>';
    ej.forEach(function(j){var c=cs.find(function(x){return x.id===j.cid;});h+='<div class="row"><div><div style="font-weight:600;font-size:12px">'+esc(j.type)+'</div><div style="font-size:11px;color:#4a6275">'+(c?esc(c.name):'')+'  · '+fmt(j.date)+'</div></div><b style="color:'+col+'">'+j.hours+'h</b></div>';});
    h+='</div>';
  });
  return h||'<div style="text-align:center;padding:32px;color:#4a6275">No data.</div>';
}
